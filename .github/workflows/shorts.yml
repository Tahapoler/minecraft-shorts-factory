
name: Minecraft Shorts Factory

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Search Minecraft videos
        run: node search.js

      - name: Save search results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minecraft-search-results
          path: results.json
          if-no-files-found: warn
